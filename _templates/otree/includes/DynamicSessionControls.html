<style>
  .session-shortcuts {
    margin: 4px 0 22px;
    padding: 18px;
    border: 1px solid #b9cbc5;
    border-left: 4px solid #176a5a;
    border-radius: 6px;
    background: #f7faf8;
  }
  .session-shortcuts__heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 13px;
  }
  .session-shortcuts__heading h4 { margin: 0; color: #18332d; font-size: 18px; }
  .session-shortcuts__heading p { margin: 0; color: #66756f; font-size: 12px; }
  .session-presets {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 9px;
  }
  .session-preset {
    min-height: 104px;
    padding: 12px;
    border: 1px solid #cbd7d3;
    border-radius: 5px;
    background: #fff;
    color: #20312d;
    text-align: left;
  }
  .session-preset:hover,
  .session-preset:focus-visible {
    border-color: #176a5a;
    box-shadow: 0 0 0 2px rgba(23, 106, 90, .12);
  }
  .session-preset.is-selected { border-color: #176a5a; background: #eaf3ef; }
  .session-preset__tag {
    display: block;
    margin-bottom: 7px;
    color: #176a5a;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .session-preset strong { display: block; margin-bottom: 5px; font-size: 14px; }
  .session-preset small { display: block; color: #65736f; line-height: 1.45; }
  .session-preset-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 13px;
  }
  .session-preset-summary__group {
    padding: 11px 12px;
    border: 1px solid #cfdbd7;
    border-radius: 4px;
    background: #fff;
  }
  .session-preset-summary__group b,
  .session-preset-summary__group span { display: block; }
  .session-preset-summary__group b { margin-bottom: 3px; color: #263a35; font-size: 13px; }
  .session-preset-summary__group span { color: #60706b; font-size: 12px; }
  .session-preset-summary__note {
    grid-column: 1 / -1;
    margin: 1px 0 0;
    color: #53645f;
    font-size: 12px;
  }
  .session-sequence-control {
    display: grid;
    grid-template-columns: minmax(210px, 320px) minmax(0, 1fr);
    gap: 18px;
    align-items: end;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid #d5dfdc;
  }
  .session-sequence-control label {
    display: block;
    margin-bottom: 6px;
    color: #263a35;
    font-size: 13px;
    font-weight: 700;
  }
  .session-sequence-control__hint {
    margin: 0 0 7px;
    color: #5d6e68;
    font-size: 12px;
    line-height: 1.5;
  }
  .custom-group-builder {
    margin-top: 15px;
    padding: 15px;
    border: 1px solid #cbd7d3;
    border-radius: 5px;
    background: #fff;
  }
  .custom-group-builder__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 12px;
  }
  .custom-group-builder__rows { display: grid; gap: 9px; }
  .custom-group-row {
    display: grid;
    grid-template-columns: 80px minmax(220px, 1fr);
    gap: 12px;
    align-items: center;
  }
  .custom-group-row label { margin: 0; font-weight: 700; }
  .custom-group-builder__totals { margin: 12px 0 0; color: #40544e; }
  .session-agent-control {
    margin: 0 0 20px;
    padding: 15px 17px;
    border: 1px solid #d3ddda;
    border-radius: 5px;
    background: #fff;
  }
  .session-agent-control__grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 820px) {
    .session-presets, .session-agent-control__grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 520px) {
    .session-shortcuts__heading { display: block; }
    .session-shortcuts__heading p { margin-top: 5px; }
    .session-presets, .session-preset-summary, .session-agent-control__grid,
    .session-sequence-control, .custom-group-row { grid-template-columns: 1fr; }
  }
</style>

<section id="dynamic-session-shortcuts" class="session-shortcuts" hidden>
  <div class="session-shortcuts__heading">
    <h4>快捷实验方案</h4>
    <p>点击后自动填写；完整参数仍可在下方继续修改</p>
  </div>
  <div class="session-presets" role="group" aria-label="动态瓶颈快捷实验方案">
    <button type="button" class="session-preset" data-preset="PAIR-I0">
      <span class="session-preset__tag">同场对比 · I0</span>
      <strong>H-I0 + HA-I0</strong>
      <small>40 个 Human 登录席位 · P001–P040</small>
    </button>
    <button type="button" class="session-preset" data-preset="PAIR-I1">
      <span class="session-preset__tag">同场对比 · I1</span>
      <strong>H-I1 + HA-I1</strong>
      <small>40 个 Human 登录席位 · P001–P040</small>
    </button>
    <button type="button" class="session-preset" data-preset="H-I0">
      <span class="session-preset__tag">H-I0</span>
      <strong>Human · 仅知均匀分布</strong>
      <small>30 Human · 总主体数 30</small>
    </button>
    <button type="button" class="session-preset" data-preset="H-I1">
      <span class="session-preset__tag">H-I1</span>
      <strong>Human · 本轮精确服务率已知</strong>
      <small>30 Human · 总主体数 30</small>
    </button>
    <button type="button" class="session-preset" data-preset="HA-I0">
      <span class="session-preset__tag">HA-I0</span>
      <strong>Human-Agent · 仅知均匀分布</strong>
      <small>10 Human + 10 LLM + 10 RL</small>
    </button>
    <button type="button" class="session-preset" data-preset="HA-I1">
      <span class="session-preset__tag">HA-I1</span>
      <strong>Human-Agent · 本轮精确服务率已知</strong>
      <small>10 Human + 10 LLM + 10 RL</small>
    </button>
    <button type="button" class="session-preset" data-preset="CUSTOM">
      <span class="session-preset__tag">自定义分组</span>
      <strong>多组匹配对比</strong>
      <small>每组选 H-I0 / H-I1 / HA-I0 / HA-I1</small>
    </button>
  </div>
  <div id="session-preset-summary" class="session-preset-summary" hidden></div>
  <div id="custom-group-builder" class="custom-group-builder" hidden>
    <div class="custom-group-builder__head">
      <div class="form-check form-switch">
        <input id="custom-grouping-enabled" class="form-check-input" type="checkbox" role="switch">
        <label class="form-check-label" for="custom-grouping-enabled">是否分组</label>
      </div>
      <div>
        <label for="custom-group-count">组数</label>
        <input id="custom-group-count" class="form-control w-auto" type="number" min="1" step="1" value="1" disabled>
      </div>
    </div>
    <div id="custom-group-rows" class="custom-group-builder__rows"></div>
    <p id="custom-group-totals" class="custom-group-builder__totals"></p>
  </div>
  <div class="session-sequence-control">
    <div>
      <label for="dynamic-capacity-sequence-preset">服务率序列</label>
      <select id="dynamic-capacity-sequence-preset" class="form-select">
        <option value="auto">自动生成（当前算法）</option>
        <option value="S01">S01 · 固定序列1</option>
        <option value="S02">S02 · 固定序列2</option>
        <option value="S03">S03 · 固定序列3</option>
        <option value="S04">S04 · 固定序列4</option>
        <option value="S05">S05 · 固定序列5</option>
      </select>
    </div>
    <p id="dynamic-capacity-sequence-hint" class="session-sequence-control__hint">
      自动模式按下方完整配置生成序列。
    </p>
  </div>
</section>

<section id="agent-count-control" class="session-agent-control" hidden>
  <label class="col-form-label" for="agent-count-per-group">每组 Agent 数量</label>
  <input id="agent-count-per-group" class="form-control w-auto" type="number" min="1" max="5" step="1">
  <p class="help-block">每个实验组加入的 Agent 数量。</p>
</section>

<section id="dynamic-agent-control" class="session-agent-control" hidden>
  <div class="session-agent-control__grid">
    <div>
      <div class="form-check form-switch mb-2">
        <input id="dynamic-agent-enabled" class="form-check-input" type="checkbox" role="switch">
        <label class="form-check-label" for="dynamic-agent-enabled">是否加入 Agent</label>
      </div>
      <div id="dynamic-agent-count-wrap" hidden>
        <label for="dynamic-agent-count-per-group">每组 Agent 数量</label>
        <input id="dynamic-agent-count-per-group" class="form-control w-auto" type="number" min="1" max="10" step="1">
        <p class="help-block">默认不分组时，该数量为整个 Session 的 Agent 总数。</p>
        <p class="help-block text-warning">DeepSeek 不可用时，Agent 会使用所选备用策略。</p>
        <div class="form-check form-switch mt-2">
          <input id="dynamic-rl-fallback-enabled" class="form-check-input" type="checkbox" role="switch">
          <label class="form-check-label" for="dynamic-rl-fallback-enabled">启用强化学习备用策略</label>
        </div>
        <p class="help-block">开启后，本地策略全程影子学习；仅在 DeepSeek 失败时接管选择。</p>
      </div>
    </div>
    <div>
      <div class="form-check form-switch mb-2">
        <input id="dynamic-independent-rl-enabled" class="form-check-input" type="checkbox" role="switch">
        <label class="form-check-label" for="dynamic-independent-rl-enabled">是否加入独立 RL 参与者</label>
      </div>
      <div id="dynamic-independent-rl-count-wrap" hidden>
        <label for="dynamic-independent-rl-count">独立 RL 参与者数量（每组）</label>
        <input id="dynamic-independent-rl-count" class="form-control w-auto" type="number" min="1" max="10" step="1">
        <p class="help-block">每个参与者独立学习；本地运行，不会增加 API 等待时间。</p>
      </div>
    </div>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const activeAgentConfigs = new Set([
    'single_bottleneck_prod_agent_active',
    'single_bottleneck_demo_agent_active',
  ]);
  const dynamicAgentConfigs = new Set([
    'dynamic_bottleneck_round_demo',
    'dynamic_bottleneck_round_prod',
  ]);
  const formalDynamicConfigs = new Set([
    'dynamic_bottleneck_round_prod',
  ]);
  const dropdown = document.querySelector('[name="session_config"]');
  const participantInput = document.querySelector('[name="num_participants"]');
  const createButton = document.getElementById('btn-create-session');
  const shortcutPanel = document.getElementById('dynamic-session-shortcuts');
  const summary = document.getElementById('session-preset-summary');
  const singleControl = document.getElementById('agent-count-control');
  const singleCountInput = document.getElementById('agent-count-per-group');
  const dynamicControl = document.getElementById('dynamic-agent-control');
  const dynamicEnabled = document.getElementById('dynamic-agent-enabled');
  const dynamicCountWrap = document.getElementById('dynamic-agent-count-wrap');
  const dynamicCountInput = document.getElementById('dynamic-agent-count-per-group');
  const fallbackEnabled = document.getElementById('dynamic-rl-fallback-enabled');
  const independentRlEnabled = document.getElementById('dynamic-independent-rl-enabled');
  const independentRlCountWrap = document.getElementById('dynamic-independent-rl-count-wrap');
  const independentRlCountInput = document.getElementById('dynamic-independent-rl-count');
  const sequencePreset = document.getElementById('dynamic-capacity-sequence-preset');
  const sequenceHint = document.getElementById('dynamic-capacity-sequence-hint');
  const customBuilder = document.getElementById('custom-group-builder');
  const customGroupingEnabled = document.getElementById('custom-grouping-enabled');
  const customGroupCount = document.getElementById('custom-group-count');
  const customGroupRows = document.getElementById('custom-group-rows');
  const customGroupTotals = document.getElementById('custom-group-totals');

  if (!dropdown || !participantInput || !createButton || !shortcutPanel
      || !singleControl || !singleCountInput || !dynamicControl
      || !dynamicEnabled || !dynamicCountWrap || !dynamicCountInput
      || !fallbackEnabled || !independentRlEnabled
      || !independentRlCountWrap || !independentRlCountInput
      || !sequencePreset || !sequenceHint || !customBuilder
      || !customGroupingEnabled || !customGroupCount || !customGroupRows
      || !customGroupTotals) {
    return;
  }

  const fieldSuffixes = [
    'api_agent_count_per_group', 'api_agent_mode', 'rl_fallback_enabled',
    'rl_agent_enabled', 'rl_agent_count_per_group', 'cohort_size',
    'grouping_enabled', 'manual_grouping_spec', 'group_agent_spec',
    'group_treatment_spec', 'capacity_information_condition',
    'capacity_sequence_id', 'capacity_sequence_seed',
    'participant_label_file', 'participant_label_assignment',
  ];
  const replacedAgentFields = new Set([
    'api_agent_count_per_group', 'api_agent_mode', 'rl_fallback_enabled',
    'rl_agent_enabled', 'rl_agent_count_per_group',
  ]);
  const sources = new Map();
  const sourceKey = (configName, fieldName) => `${configName}.${fieldName}`;
  const sourceFor = (configName, fieldName) => sources.get(sourceKey(configName, fieldName));

  for (const configName of [...activeAgentConfigs, ...dynamicAgentConfigs]) {
    for (const fieldName of fieldSuffixes) {
      const source = document.querySelector(`[name="${configName}.${fieldName}"]`);
      if (source) sources.set(sourceKey(configName, fieldName), source);
    }
  }
  for (const configName of dynamicAgentConfigs) {
    sourceFor(configName, 'capacity_sequence_id')
      ?.closest('tr')?.setAttribute('hidden', 'hidden');
    sourceFor(configName, 'capacity_sequence_seed')
      ?.closest('tr')?.setAttribute('hidden', 'hidden');
    sourceFor(configName, 'group_treatment_spec')
      ?.closest('tr')?.setAttribute('hidden', 'hidden');
    sourceFor(configName, 'participant_label_file')
      ?.closest('tr')?.setAttribute('hidden', 'hidden');
    sourceFor(configName, 'participant_label_assignment')
      ?.closest('tr')?.setAttribute('hidden', 'hidden');
  }
  if ([...activeAgentConfigs, ...dynamicAgentConfigs].some(
    configName => !sourceFor(configName, 'api_agent_count_per_group')
  )) return;

  for (const configName of [...activeAgentConfigs, ...dynamicAgentConfigs]) {
    for (const fieldName of replacedAgentFields) {
      sourceFor(configName, fieldName)?.closest('tr')?.setAttribute('hidden', 'hidden');
    }
  }

  let currentConfig = '';
  let applyingPreset = false;
  let selectedPreset = 'PAIR-I0';
  let customSelections = ['H-I0', 'HA-I0'];
  const presets = {
    'PAIR-I0': {
      humans: 40,
      treatments: ['H-I0', 'HA-I0'],
      groups: [
        ['G01 · H-I0 · P001–P030', '30 Human · 总主体数 30'],
        ['G02 · HA-I0 · P031–P040', '10 Human + 10 LLM + 10 RL · 总主体数 30'],
      ],
    },
    'PAIR-I1': {
      humans: 40,
      treatments: ['H-I1', 'HA-I1'],
      groups: [
        ['G01 · H-I1 · P001–P030', '30 Human · 总主体数 30'],
        ['G02 · HA-I1 · P031–P040', '10 Human + 10 LLM + 10 RL · 总主体数 30'],
      ],
    },
    'H-I0': {
      humans: 30,
      treatments: ['H-I0'],
      groups: [['G01 · H-I0 · P001–P030', '30 Human · 总主体数 30']],
    },
    'H-I1': {
      humans: 30,
      treatments: ['H-I1'],
      groups: [['G01 · H-I1 · P001–P030', '30 Human · 总主体数 30']],
    },
    'HA-I0': {
      humans: 10,
      treatments: ['HA-I0'],
      groups: [['G01 · HA-I0 · P001–P010', '10 Human + 10 LLM + 10 RL · 总主体数 30']],
    },
    'HA-I1': {
      humans: 10,
      treatments: ['HA-I1'],
      groups: [['G01 · HA-I1 · P001–P010', '10 Human + 10 LLM + 10 RL · 总主体数 30']],
    },
  };
  const formalScenarioConfig = 'dynamic_bottleneck_round_prod';
  const treatmentOptions = ['H-I0', 'H-I1', 'HA-I0', 'HA-I1'];
  const capacitySequenceSeeds = {
    S01: 2026091101,
    S02: 2026091102,
    S03: 2026091103,
    S04: 2026091104,
    S05: 2026091105,
  };

  function setSource(fieldName, value) {
    const source = sourceFor(currentConfig, fieldName);
    if (source) source.value = String(value);
  }
  function readSource(fieldName, fallback = '') {
    return sourceFor(currentConfig, fieldName)?.value ?? fallback;
  }
  function storeSequenceSelection() {
    const sequenceId = sequencePreset.value || 'auto';
    setSource('capacity_sequence_id', sequenceId);
    if (capacitySequenceSeeds[sequenceId]) {
      setSource('capacity_sequence_seed', capacitySequenceSeeds[sequenceId]);
    }
  }
  function updateSequenceHint() {
    sequenceHint.textContent = sequencePreset.value === 'auto'
      ? '自动模式按下方完整配置生成序列。'
      : `创建后将加载 ${sequencePreset.value} 的固定30轮序列，并让同一 Session 内各组共用。`;
  }
  function parseStoredTreatments() {
    const raw = readSource('group_treatment_spec', 'G01:H-I0');
    const values = raw.split(';').map(item => item.split(':')[1]).filter(
      value => treatmentOptions.includes(value)
    );
    return values.length ? values : ['H-I0'];
  }
  function humanCountForTreatment(treatment) {
    return treatment.startsWith('HA-') ? 10 : 30;
  }
  function formatRoomLabel(position) {
    return `P${String(position).padStart(3, '0')}`;
  }
  function labelRangeForGroup(start, humanCount) {
    const first = formatRoomLabel(start);
    const last = formatRoomLabel(start + humanCount - 1);
    return first === last ? first : `${first}–${last}`;
  }
  function presetCodeForTreatments(treatments) {
    for (const [code, preset] of Object.entries(presets)) {
      if (preset.treatments.length === treatments.length
          && preset.treatments.every((value, index) => value === treatments[index])) {
        return code;
      }
    }
    return 'CUSTOM';
  }
  function syncCustomSpec() {
    const count = customGroupingEnabled.checked
      ? Math.max(1, Number.parseInt(customGroupCount.value, 10) || 1)
      : 1;
    customSelections = customSelections.slice(0, count);
    while (customSelections.length < count) customSelections.push('H-I0');
    const spec = customSelections.map(
      (treatment, index) => `G${String(index + 1).padStart(2, '0')}:${treatment}`
    ).join(';');
    const haGroups = customSelections.filter(value => value.startsWith('HA-')).length;
    const hGroups = count - haGroups;
    const humans = hGroups * 30 + haGroups * 10;
    const agents = haGroups * 20;
    participantInput.value = String(humans);
    setSource('group_treatment_spec', spec);
    setSource('grouping_enabled', count > 1 ? 1 : 0);
    setSource('cohort_size', 0);
    setSource('manual_grouping_spec', '');
    setSource('group_agent_spec', '');
    setSource('api_agent_mode', haGroups ? 'active' : 'off');
    setSource('api_agent_count_per_group', haGroups ? 10 : 0);
    setSource('rl_agent_enabled', haGroups ? 1 : 0);
    setSource('rl_agent_count_per_group', haGroups ? 10 : 0);
    setSource('capacity_information_condition', customSelections[0].endsWith('I1') ? 'I1' : 'I0');
    customGroupTotals.textContent = `共 ${count} 组：${humans} 个 Human 登录席位 + ${agents} 个虚拟 Agent；每组总主体数 30。`;
    let nextLabelNumber = 1;
    summary.innerHTML = customSelections.map((treatment, index) => {
      const humanCount = humanCountForTreatment(treatment);
      const labelRange = labelRangeForGroup(nextLabelNumber, humanCount);
      nextLabelNumber += humanCount;
      const members = treatment.startsWith('HA-')
        ? '10 Human + 10 LLM + 10 RL'
        : '30 Human';
      return `<div class="session-preset-summary__group"><b>G${String(index + 1).padStart(2, '0')} · ${treatment} · ${labelRange}</b><span>${members} · 总主体数 30</span></div>`;
    }).join('') + '<p class="session-preset-summary__note">各组独立排队与结算，同轮共享上方选定的随机服务率序列。</p>';
    summary.hidden = false;
  }
  function renderCustomRows() {
    const count = customGroupingEnabled.checked
      ? Math.max(1, Number.parseInt(customGroupCount.value, 10) || 1)
      : 1;
    customGroupCount.value = String(count);
    customSelections = customSelections.slice(0, count);
    while (customSelections.length < count) customSelections.push('H-I0');
    customGroupRows.innerHTML = customSelections.map((selected, index) => (
      `<div class="custom-group-row"><label for="custom-group-${index + 1}">G${String(index + 1).padStart(2, '0')}</label><select id="custom-group-${index + 1}" class="form-select custom-group-treatment" data-index="${index}">${treatmentOptions.map(value => `<option value="${value}"${value === selected ? ' selected' : ''}>${value}</option>`).join('')}</select></div>`
    )).join('');
    customGroupRows.querySelectorAll('.custom-group-treatment').forEach(select => {
      select.addEventListener('change', () => {
        customSelections[Number(select.dataset.index)] = select.value;
        syncCustomSpec();
      });
    });
    syncCustomSpec();
  }
  function syncVisibleControls() {
    const dynamicVisible = dynamicAgentConfigs.has(currentConfig);
    const formalVisible = formalDynamicConfigs.has(currentConfig);
    const singleVisible = activeAgentConfigs.has(currentConfig);
    shortcutPanel.hidden = !formalVisible;
    dynamicControl.hidden = !dynamicVisible || formalVisible;
    singleControl.hidden = !singleVisible;
    if (singleVisible) singleCountInput.value = readSource('api_agent_count_per_group', '1') || '1';
    if (dynamicVisible) {
      const storedSequence = readSource('capacity_sequence_id', 'auto') || 'auto';
      sequencePreset.options[0].disabled = formalVisible;
      sequencePreset.value = [...sequencePreset.options].some(
        option => option.value === storedSequence
      ) && !(formalVisible && storedSequence === 'auto') ? storedSequence : (formalVisible ? 'S01' : 'auto');
      storeSequenceSelection();
      updateSequenceHint();
      dynamicEnabled.checked = readSource('api_agent_mode', 'off') === 'active';
      dynamicCountInput.value = readSource('api_agent_count_per_group', '1') || '1';
      fallbackEnabled.checked = readSource('rl_fallback_enabled', '0') === '1';
      independentRlEnabled.checked = readSource('rl_agent_enabled', '0') === '1';
      independentRlCountInput.value = readSource('rl_agent_count_per_group', '1') || '1';
      dynamicCountWrap.hidden = !dynamicEnabled.checked;
      independentRlCountWrap.hidden = !independentRlEnabled.checked;
      if (formalVisible) {
        customSelections = parseStoredTreatments();
        selectedPreset = presetCodeForTreatments(customSelections);
        customGroupingEnabled.checked = customSelections.length > 1;
        customGroupCount.disabled = !customGroupingEnabled.checked;
        customGroupCount.value = String(customSelections.length);
        customBuilder.hidden = selectedPreset !== 'CUSTOM';
        if (selectedPreset === 'CUSTOM') {
          renderCustomRows();
        } else {
          syncCustomSpec();
          showPresetSummary(presets[selectedPreset]);
        }
        markPresetSelected(selectedPreset);
      } else {
        customBuilder.hidden = true;
      }
    }
  }
  function storeVisibleControls() {
    if (activeAgentConfigs.has(currentConfig)) {
      setSource('api_agent_count_per_group', singleCountInput.value || 1);
    }
    if (!dynamicAgentConfigs.has(currentConfig)) return;
    storeSequenceSelection();
    if (formalDynamicConfigs.has(currentConfig)) {
      syncCustomSpec();
      return;
    }
    setSource('api_agent_mode', dynamicEnabled.checked ? 'active' : 'off');
    setSource('api_agent_count_per_group', dynamicEnabled.checked ? (dynamicCountInput.value || 1) : 0);
    setSource('rl_fallback_enabled', dynamicEnabled.checked && fallbackEnabled.checked ? 1 : 0);
    setSource('rl_agent_enabled', independentRlEnabled.checked ? 1 : 0);
    setSource('rl_agent_count_per_group', independentRlEnabled.checked ? (independentRlCountInput.value || 1) : 0);
  }
  function showPresetSummary(preset) {
    summary.innerHTML = preset.groups.map(([name, members]) => (
      `<div class="session-preset-summary__group"><b>${name}</b><span>${members}</span></div>`
    )).join('') + '<p class="session-preset-summary__note">已自动填写真实参与者、分组、Agent 和服务率同步参数；可继续展开下方完整配置修改。</p>';
    summary.hidden = false;
  }
  function markPresetSelected(code) {
    shortcutPanel.querySelectorAll('[data-preset]').forEach(button => {
      button.classList.toggle('is-selected', button.dataset.preset === code);
    });
  }
  function applyPreset(code) {
    if (currentConfig !== formalScenarioConfig) return;
    const preset = presets[code];
    if (code !== 'CUSTOM' && !preset) return;
    applyingPreset = true;
    selectedPreset = code;
    if (code === 'CUSTOM') {
      customGroupingEnabled.checked = customSelections.length > 1;
      customGroupCount.disabled = !customGroupingEnabled.checked;
      customBuilder.hidden = false;
      renderCustomRows();
    } else {
      customSelections = [...preset.treatments];
      customGroupingEnabled.checked = customSelections.length > 1;
      customGroupCount.disabled = !customGroupingEnabled.checked;
      customGroupCount.value = String(customSelections.length);
      customBuilder.hidden = true;
      participantInput.value = String(preset.humans);
      syncCustomSpec();
      showPresetSummary(preset);
      markPresetSelected(code);
    }
    applyingPreset = false;
  }
  function switchToCustomAgentConfiguration() {
    if (applyingPreset || !dynamicAgentConfigs.has(currentConfig)) return;
    setSource('group_agent_spec', '');
    markPresetSelected('');
    summary.innerHTML = '<p class="session-preset-summary__note">演示配置的 Agent 数量已手动调整。</p>';
    summary.hidden = false;
  }

  shortcutPanel.querySelectorAll('[data-preset]').forEach(button => {
    button.addEventListener('click', () => applyPreset(button.dataset.preset));
  });
  dropdown.addEventListener('change', () => {
    storeVisibleControls();
    currentConfig = dropdown.value;
    summary.hidden = true;
    markPresetSelected('');
    syncVisibleControls();
  });
  singleCountInput.addEventListener('input', storeVisibleControls);
  dynamicEnabled.addEventListener('change', () => {
    dynamicCountWrap.hidden = !dynamicEnabled.checked;
    switchToCustomAgentConfiguration();
    storeVisibleControls();
  });
  dynamicCountInput.addEventListener('input', () => {
    switchToCustomAgentConfiguration();
    storeVisibleControls();
  });
  fallbackEnabled.addEventListener('change', storeVisibleControls);
  independentRlEnabled.addEventListener('change', () => {
    independentRlCountWrap.hidden = !independentRlEnabled.checked;
    switchToCustomAgentConfiguration();
    storeVisibleControls();
  });
  independentRlCountInput.addEventListener('input', () => {
    switchToCustomAgentConfiguration();
    storeVisibleControls();
  });
  sequencePreset.addEventListener('change', () => {
    storeSequenceSelection();
    updateSequenceHint();
  });
  customGroupingEnabled.addEventListener('change', () => {
    customGroupCount.disabled = !customGroupingEnabled.checked;
    if (!customGroupingEnabled.checked) customGroupCount.value = '1';
    renderCustomRows();
  });
  customGroupCount.addEventListener('input', renderCustomRows);
  createButton.addEventListener('click', event => {
    storeVisibleControls();
    const activeCountInput = activeAgentConfigs.has(currentConfig)
      ? singleCountInput : dynamicEnabled.checked ? dynamicCountInput : null;
    if (activeCountInput && !activeCountInput.checkValidity()) {
      activeCountInput.reportValidity();
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    if (independentRlEnabled.checked && !independentRlCountInput.checkValidity()) {
      independentRlCountInput.reportValidity();
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);

  currentConfig = dropdown.value;
  syncVisibleControls();
});
</script>
